[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vocalstudio"
version = "0.3.0"
description = "Local desktop karaoke and pitch practice"
requires-python = ">=3.10,<3.14"
dependencies = ["PySide6-Essentials>=6.7,<7", "numpy>=1.26,<3", "scipy>=1.12,<2", "soundfile>=0.12,<1", "sounddevice>=0.5,<1", "onnxruntime>=1.17", "imageio-ffmpeg>=0.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vocalstudio = "vocalstudio.app:main"

[tool.setuptools.packages.find]
include = ["vocalstudio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
